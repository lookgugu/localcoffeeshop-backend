name: Tests
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Tracked database must be untouched by tests
        run: git diff --exit-code -- data/
